services:
  skyagent:
    build: .
    environment:
      WEATHER_DEFAULT_LATITUDE: ${WEATHER_DEFAULT_LATITUDE:-55.7558}
      WEATHER_DEFAULT_LONGITUDE: ${WEATHER_DEFAULT_LONGITUDE:-37.6173}
      WEATHER_DEFAULT_FORECAST_DAYS: ${WEATHER_DEFAULT_FORECAST_DAYS:-3}
      WEATHER_DEFAULT_TIMEZONE: ${WEATHER_DEFAULT_TIMEZONE:-auto}
