services:
  skyagent:
    build: .
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:?LLM_TEMPERATURE is required}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:?LLM_REQUEST_TIMEOUT is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-30}
      TELEGRAM_REQUEST_TIMEOUT: ${TELEGRAM_REQUEST_TIMEOUT:-35}
      WEATHER_DEFAULT_LATITUDE: ${WEATHER_DEFAULT_LATITUDE:?WEATHER_DEFAULT_LATITUDE is required}
      WEATHER_DEFAULT_LONGITUDE: ${WEATHER_DEFAULT_LONGITUDE:?WEATHER_DEFAULT_LONGITUDE is required}
      WEATHER_DEFAULT_FORECAST_DAYS: ${WEATHER_DEFAULT_FORECAST_DAYS:?WEATHER_DEFAULT_FORECAST_DAYS is required}
      WEATHER_DEFAULT_TIMEZONE: ${WEATHER_DEFAULT_TIMEZONE:?WEATHER_DEFAULT_TIMEZONE is required}
